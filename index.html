<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>리뷰 프롬프트 생성기</title>
  <style>
    body { font-family: Arial; padding: 30px; max-width: 600px; margin: auto; }
    label, input, select, textarea, button {
      display: block; width: 100%; margin-bottom: 15px;
    }
    textarea { height: 150px; }
  </style>
</head>
<body>
  <h2>리뷰 프롬프트 생성기</h2>
  <form onsubmit="generatePrompt(); return false;">
    <label>카테고리</label>
    <input type="text" id="category" required>

    <label>제품명</label>
    <input type="text" id="product" required>

    <label>키워드 (쉼표로 구분)</label>
    <input type="text" id="keywords" required>

    <label>평점 (예: 4/5)</label>
    <input type="text" id="rating" required>

    <label>톤</label>
    <select id="tone">
      <option>긍정</option>
      <option selected>중립</option>
      <option>부정</option>
    </select>

    <label>길이 (숫자만 입력하세요)</label>
    <input type="text" id="length" required>

    <label>언어</label>
    <select id="language">
      <option selected>한국어</option>
      <option>영어</option>
    </select>

    <button type="submit">프롬프트 생성</button>
  </form>

  <h3>생성된 프롬프트</h3>
  <textarea id="output" readonly onclick="this.select()"></textarea>
  <button type="button" onclick="copyOutput()">복사</button>
  <p id="copy-status" role="status" aria-live="polite"></p>

  <script>
    function generatePrompt() {
      const category = document.getElementById('category').value;
      const product = document.getElementById('product').value;
      const keywords = document.getElementById('keywords').value;
      const rating = document.getElementById('rating').value;
      const tone = document.getElementById('tone').value;
      const length = document.getElementById('length').value + "문장";
      const language = document.getElementById('language').value;

      const prompt = `카테고리: ${category} 제품명: ${product} 키워드: ${keywords} 평점: ${rating} 톤: ${tone} 길이: ${length} 언어: ${language}`;

      document.getElementById('output').value = prompt;
    }

    async function copyOutput() {
      const textarea = document.getElementById('output');
      const status = document.getElementById('copy-status');
      const text = textarea.value;
      status.textContent = '';

      if (!text) {
        status.textContent = '먼저 프롬프트를 생성해 주세요.';
        return;
      }

      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(text);
          status.textContent = '복사했습니다.';
          return;
        }
      } catch (error) {
        // Clipboard access can be denied even when the API is available.
      }

      try {
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        if (document.execCommand('copy')) {
          status.textContent = '복사했습니다.';
          return;
        }
      } catch (error) {
        // Keep the text available for manual copying if both methods fail.
      }
      status.textContent = '자동 복사에 실패했습니다. 텍스트를 선택해 직접 복사해 주세요.';
    }
  </script>
</body>
</html>
